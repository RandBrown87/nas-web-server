# ====================================================================
# Apache 2.4 VirtualHost Configuration for Linux NAS Web Server
# Reverse Proxy to Gunicorn with ModSecurity Web Application Firewall
# ====================================================================

<VirtualHost *:80>
    ServerName nas.local
    ServerAlias *
    ServerAdmin webmaster@localhost

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/nas_error.log
    CustomLog ${APACHE_LOG_DIR}/nas_access.log combined

    # Security Headers
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # ModSecurity WAF Protection
    <IfModule security2_module>
        SecRuleEngine On
        IncludeOptional /etc/modsecurity/modsecurity_nas.conf
    </IfModule>

    # Serve static assets directly for high performance
    Alias /static /srv/nas-web-server/app/static
    <Directory /srv/nas-web-server/app/static>
        Require all granted
        ExpiresActive On
        ExpiresDefault "access plus 1 month"
    </Directory>

    # Proxy all dynamic requests to Gunicorn WSGI running on 127.0.0.1:5050
    ProxyPreserveHost On
    ProxyPass /static !
    ProxyPass / http://127.0.0.1:5050/
    ProxyPassReverse / http://127.0.0.1:5050/

    # Forward original client headers for accurate logging and WAF analysis
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Real-IP "%{REMOTE_ADDR}s"
</VirtualHost>
