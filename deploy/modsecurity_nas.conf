# ====================================================================
# ModSecurity Web Application Firewall (WAF) Configuration for Linux NAS
# Component: ModSecurity v2.9+ / v3 + OWASP Core Rule Set (CRS)
# ====================================================================

# 1. Core Rule Engine Configuration
SecRuleEngine On
SecRequestBodyAccess On
SecResponseBodyAccess Off
SecRequestBodyLimit 104857600
SecRequestBodyNoFilesLimit 131072
SecRequestBodyLimitAction Reject

# Temporary & Data Storage
SecTmpDir /tmp/
SecDataDir /tmp/

# Audit Logging Configuration
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!(?:04|03)))"
SecAuditLogParts ABIJDEFHZ
SecAuditLogType Serial
SecAuditLog /var/log/apache2/modsec_audit.log

# 2. Scanner & Malicious Bot Blocking
SecRule REQUEST_HEADERS:User-Agent "@pmFromFile /etc/modsecurity/scanners-user-agents.data" \
    "id:10001,phase:1,deny,status:403,log,msg:'Vulnerability scanner detected and blocked by NAS WAF'"

# Fallback pattern match for aggressive automated scanners
SecRule REQUEST_HEADERS:User-Agent "@rx (?i)(sqlmap|nikto|acunetix|masscan|dirbuster|gobuster|nessus)" \
    "id:10002,phase:1,deny,status:403,log,msg:'Automated security scanner user agent blocked'"

# 3. Path Traversal & Local File Inclusion (LFI) Rules
SecRule REQUEST_URI|REQUEST_BODY "@rx (?i)(\.\./|\.\.\\|%2e%2e%2f|/etc/passwd|/etc/shadow|/windows/win\.ini)" \
    "id:10010,phase:2,deny,status:403,log,msg:'Directory Traversal / LFI Attempt Intercepted'"

# 4. SQL Injection (SQLi) Protection Rules (OWASP CRS aligned)
SecRule ARGS|ARGS_NAMES|REQUEST_COOKIES|XML:/* "@rx (?i)(\bunion(\s+all)?\s+select\b|\bselect\s+.+\s+from\b|\bdrop\s+table\b|\binsert\s+into\b|\bdelete\s+from\b)" \
    "id:10020,phase:2,deny,status:403,log,msg:'SQL Injection pattern detected in parameters'"

SecRule ARGS|ARGS_NAMES "@rx (?i)(\bor\b|\band\b)\s+[\'\"]?\w+[\'\"]?\s*=\s*[\'\"]?\w+" \
    "id:10021,phase:2,deny,status:403,log,msg:'SQL Injection boolean logic pattern detected'"

SecRule ARGS|ARGS_NAMES "@rx (?i)(\bsleep\s*\(|\bbenchmark\s*\(|\bload_file\s*\()" \
    "id:10022,phase:2,deny,status:403,log,msg:'SQL Injection time-based/file function detected'"

# 5. Cross-Site Scripting (XSS) Protection Rules
SecRule ARGS|ARGS_NAMES|REQUEST_HEADERS "@rx (?i)(<\s*script[^>]*>|javascript\s*:|vbscript\s*:|on(load|error|click|mouseover)\s*=)" \
    "id:10030,phase:2,deny,status:403,log,msg:'Cross-Site Scripting (XSS) payload blocked'"

# 6. Remote Code Execution (RCE) / Command Injection
SecRule ARGS|REQUEST_HEADERS "@rx (?i)(;\s*(/bin/|/usr/bin/)?(sh|bash|cat|rm|whoami|curl|wget)\b|\|\s*(sh|bash)\b|\$\(.*\))" \
    "id:10040,phase:2,deny,status:403,log,msg:'OS Command Injection Attempt Intercepted'"
